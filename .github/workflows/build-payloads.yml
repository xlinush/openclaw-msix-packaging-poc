name: Build OpenClaw payloads and MSIX

on:
  pull_request:
    paths:
      - .github/workflows/build-payloads.yml
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - OpenClaw.MsixPackaging.sln
      - src/**
      - tests/**
      - scripts/Build-Payload.ps1
      - scripts/Build-Msix.ps1
      - scripts/Test-PublicSafety.ps1
  workflow_dispatch:
    inputs:
      openclaw_ref:
        description: Public openclaw/openclaw tag, branch, or commit to package
        required: true
        default: d2825c70a5168c19e98ec75babf27476a3c15669
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-payloads.yml
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - OpenClaw.MsixPackaging.sln
      - src/**
      - tests/**
      - scripts/Build-Payload.ps1
      - scripts/Build-Msix.ps1
      - scripts/Test-PublicSafety.ps1

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 11.15.1
  OPENCLAW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.openclaw_ref || 'd2825c70a5168c19e98ec75babf27476a3c15669' }}

jobs:
  public-safety:
    name: Scan public repository
    runs-on: windows-latest
    steps:
      - name: Check out repository and history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked repository
        shell: pwsh
        run: .\scripts\Test-PublicSafety.ps1 -Mode Repository

      - name: Scan reachable Git history
        shell: pwsh
        run: .\scripts\Test-PublicSafety.ps1 -Mode History

  build-package:
    name: Build public npm package
    needs: public-safety
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      package_version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out OpenClaw source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: openclaw/openclaw
          ref: ${{ env.OPENCLAW_REF }}
          path: openclaw-source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        working-directory: openclaw-source
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        working-directory: openclaw-source
        env:
          OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"
        run: |
          pnpm build
          pnpm ui:build

      - name: Pack npm package
        id: source
        working-directory: openclaw-source
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/openclaw-package"
          mkdir -p "${artifact_dir}"
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog \
            --skip-build \
            --pnpm-pack \
            --output-dir "${artifact_dir}" \
            --output-name openclaw.tgz

          source_sha="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

          cat > "${artifact_dir}/source.json" <<EOF
          {
            "repository": "https://github.com/openclaw/openclaw",
            "requestedRef": "${OPENCLAW_REF}",
            "resolvedCommit": "${source_sha}",
            "packageVersion": "${package_version}"
          }
          EOF

      - name: Upload intermediate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-npm-package
          path: ${{ runner.temp }}/openclaw-package/
          if-no-files-found: error
          retention-days: 7

  build-payload:
    name: Build ${{ matrix.architecture }} payload
    needs: build-package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out packaging workflow
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download intermediate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openclaw-npm-package
          path: ${{ runner.temp }}\openclaw-package

      - name: Stage and archive payload
        shell: pwsh
        run: |
          .\scripts\Build-Payload.ps1 `
            -PackageDirectory '${{ runner.temp }}\openclaw-package' `
            -Architecture '${{ matrix.architecture }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-payload'

      - name: Inspect payload archive
        shell: pwsh
        run: |
          .\scripts\Test-PublicSafety.ps1 `
            -Mode Package `
            -Path '${{ runner.temp }}\openclaw-payload\app-${{ matrix.architecture }}.tar.gz' `
            -ProvenancePath '${{ runner.temp }}\openclaw-payload\payload-metadata.json'

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload\
          if-no-files-found: error
          retention-days: 7

  build-msix:
    name: Build ${{ matrix.architecture }} MSIX
    needs: build-payload
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/**/*.csproj
            tests/**/*.csproj

      - name: Download payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openclaw-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload

      - name: Restore NativeAOT and MSIX dependencies
        shell: pwsh
        run: |
          dotnet restore .\src\OpenClaw.MsixHost\OpenClaw.MsixHost.csproj `
            --runtime 'win-${{ matrix.architecture }}' `
            -p:PublishAot=true `
            -p:IncludePackagingContent=true `
            -p:Platform='${{ matrix.architecture }}'

      - name: Compose and sign development MSIX
        shell: pwsh
        run: |
          .\scripts\Build-Msix.ps1 `
            -PayloadDirectory '${{ runner.temp }}\openclaw-payload' `
            -Architecture '${{ matrix.architecture }}' `
            -NodeVersion '${{ env.NODE_VERSION }}' `
            -PackageVersion '0.1.${{ github.run_number }}.${{ github.run_attempt }}' `
            -SourceCommit '${{ github.sha }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-msix'

      - name: Inspect signed MSIX
        shell: pwsh
        run: |
          .\scripts\Test-PublicSafety.ps1 `
            -Mode Package `
            -Path '${{ runner.temp }}\openclaw-msix\openclaw-poc-${{ matrix.architecture }}.msix' `
            -ProvenancePath '${{ runner.temp }}\openclaw-msix\msix-metadata.json'

      - name: Upload MSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-poc-msix-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}\openclaw-msix\openclaw-poc-${{ matrix.architecture }}.msix
            ${{ runner.temp }}\openclaw-msix\openclaw-poc-${{ matrix.architecture }}.cer
            ${{ runner.temp }}\openclaw-msix\msix-metadata.json
          if-no-files-found: error
          retention-days: 7
