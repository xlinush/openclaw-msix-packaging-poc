name: Build OpenClaw payloads

on:
  workflow_dispatch:
    inputs:
      openclaw_ref:
        description: Public openclaw/openclaw tag, branch, or commit to package
        required: true
        default: d2825c70a5168c19e98ec75babf27476a3c15669
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-payloads.yml
      - scripts/Build-Payload.ps1

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 11.15.1
  OPENCLAW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.openclaw_ref || 'd2825c70a5168c19e98ec75babf27476a3c15669' }}

jobs:
  build-package:
    name: Build public npm package
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      package_version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out OpenClaw source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openclaw/openclaw
          ref: ${{ env.OPENCLAW_REF }}
          path: openclaw-source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        working-directory: openclaw-source
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        working-directory: openclaw-source
        env:
          OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"
        run: |
          pnpm build
          pnpm ui:build

      - name: Pack npm package
        id: source
        working-directory: openclaw-source
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/openclaw-package"
          mkdir -p "${artifact_dir}"
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog \
            --skip-build \
            --pnpm-pack \
            --output-dir "${artifact_dir}" \
            --output-name openclaw.tgz

          source_sha="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

          cat > "${artifact_dir}/source.json" <<EOF
          {
            "repository": "https://github.com/openclaw/openclaw",
            "requestedRef": "${OPENCLAW_REF}",
            "resolvedCommit": "${source_sha}",
            "packageVersion": "${package_version}"
          }
          EOF

      - name: Upload intermediate package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openclaw-npm-package
          path: ${{ runner.temp }}/openclaw-package/
          if-no-files-found: error
          retention-days: 7

  build-payload:
    name: Build ${{ matrix.architecture }} payload
    needs: build-package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out packaging workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download intermediate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openclaw-npm-package
          path: ${{ runner.temp }}\openclaw-package

      - name: Stage and archive payload
        shell: pwsh
        run: |
          .\scripts\Build-Payload.ps1 `
            -PackageDirectory '${{ runner.temp }}\openclaw-package' `
            -Architecture '${{ matrix.architecture }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-payload'

      - name: Upload payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openclaw-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload\
          if-no-files-found: error
          retention-days: 7
