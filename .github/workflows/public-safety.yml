name: Public safety

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-safety:
    name: Scan repository and history
    runs-on: windows-latest
    steps:
      - name: Check out repository and history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked repository
        shell: pwsh
        run: .\scripts\Test-PublicSafety.ps1 -Mode Repository

      - name: Scan reachable Git history
        shell: pwsh
        run: .\scripts\Test-PublicSafety.ps1 -Mode History
