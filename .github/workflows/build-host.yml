name: Validate C# host

on:
  pull_request:
    paths:
      - .github/workflows/build-host.yml
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - OpenClaw.MSIXPackaging.sln
      - src/**
      - tests/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-host.yml
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - OpenClaw.MSIXPackaging.sln
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test host
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/**/*.csproj
            tests/**/*.csproj

      - name: Restore dependencies
        run: dotnet restore .\OpenClaw.MSIXPackaging.sln

      - name: Run tests
        run: dotnet test .\OpenClaw.MSIXPackaging.sln --configuration Release --no-restore

  validate-native-aot:
    name: Validate NativeAOT ${{ matrix.runtime }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/**/*.csproj
            tests/**/*.csproj

      - name: Publish host
        shell: pwsh
        run: |
          $env:Path = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:Path"
          dotnet restore .\src\OpenClaw.MSIXHost\OpenClaw.MSIXHost.csproj `
            --runtime '${{ matrix.runtime }}' `
            -p:PublishAot=true
          dotnet publish .\src\OpenClaw.MSIXHost\OpenClaw.MSIXHost.csproj `
            --configuration Release `
            --runtime '${{ matrix.runtime }}' `
            --self-contained true `
            --output '${{ runner.temp }}\host' `
            --no-restore `
            -p:DebugType=None
          $files = @(Get-ChildItem '${{ runner.temp }}\host' -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'openclaw-poc.exe') {
            throw (
              'NativeAOT publication must contain only openclaw-poc.exe; found: ' +
              (($files.Name | Sort-Object) -join ', ')
            )
          }
